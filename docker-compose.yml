services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./faiss_index:/app/faiss_index
      - ./reports:/app/reports
      - ./complaints.json:/app/complaints.json
      - ./hitl.db:/app/hitl.db

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      BANK_API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
